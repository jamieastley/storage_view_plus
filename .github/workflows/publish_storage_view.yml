name: Publish storage_view_plus to pub.dev

on:
  push:
    tags:
      - 'storage_view_plus-v[0-9]+.[0-9]+.[0-9]+'

jobs:
  pub_dev_publish:
    name: Publish storage_view_plus to pub.dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/storage_view_plus
    permissions:
      id-token: write # Required for authentication using OIDC

    environment: pub.dev

    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - name: Read Dart version
        id: dart-version
        run: |
          version=$(python3 -c 'import os, tomllib; print(tomllib.load(open(os.path.join(os.environ["GITHUB_WORKSPACE"], ".prototools"), "rb"))["dart"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dart-lang/setup-dart@v1 # Configure `PUB_TOKEN` for OIDC
        with:
          sdk: ${{ steps.dart-version.outputs.version }}
      - name: Get Flutter packages
        run: flutter pub get
      - name: Publish to pub.dev
        run: flutter pub publish --force
