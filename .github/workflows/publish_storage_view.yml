name: Publish storage_view_plus to pub.dev

on:
  push:
    tags:
      - 'storage_view_plus-v[0-9]+.[0-9]+.[0-9]+'

jobs:
  pub_dev_publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/storage_view_plus
    permissions:
      id-token: write # Required for authentication using OIDC

    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - uses: dart-lang/setup-dart@v1
      - name: Get Flutter packages
        run: flutter pub get
      - name: Publish to pub.dev
        run: flutter pub publish -n # dry-run for testing
#        run: flutter pub publish --force
